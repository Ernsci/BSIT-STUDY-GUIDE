<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure document</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f7fa; color: #1f2933; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); text-align: center; margin-top: 8vh; }
  .card h1 { font-size: 20px; margin: 0 0 8px; }
  .card p { color: #52606d; margin: 0 0 20px; }
  input[type=text] { width: 100%; padding: 12px 14px; border: 1px solid #d3dce6; border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #9aa5b1; cursor: not-allowed; }
  .status { margin-top: 16px; color: #52606d; font-size: 14px; }
  .denied { margin-top: 16px; color: #c0392b; font-weight: 600; }

  .topbar { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .topbar .title { font-size: 15px; font-weight: 600; }
  .topbar .zoom { display: flex; align-items: center; gap: 6px; }
  .topbar button.z { width: auto; padding: 6px 12px; font-size: 14px; background: #e4e7eb; color: #1f2933; }
  .topbar button.z:disabled { opacity: .4; }
  .topbar .zval { min-width: 52px; text-align: center; font-size: 13px; color: #52606d; }

  .viewer { background: #3a3f44; padding: 20px 8px 40px; border-radius: 12px; margin-top: 16px; }
  .page { max-width: 560px; margin: 0 auto 20px; background: #fff; box-shadow: 0 4px 20px rgba(0,0,0,.45); overflow: hidden; }
  .page:last-child { margin-bottom: 0; }
  .page canvas { width: 100%; display: block; height: auto; }
  .page-num { text-align: center; color: #c8cdd2; font-size: 12px; padding-top: 10px; }

  .loader { text-align: center; color: #c8cdd2; padding: 20px 0; font-size: 13px; }

  @media (max-width: 480px) {
    .viewer { padding: 12px 0 24px; }
    .page { border-radius: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="gate">
    <h1>Secure document</h1>
    <p>This document is access-controlled. Enter your name to request access from the owner.</p>
    <input type="text" id="name" placeholder="Your name" autocomplete="off">
    <button id="btn">Request access</button>
    <div class="status" id="status"></div>
  </div>

  <div id="viewerWrap" style="display:none">
    <div class="topbar">
      <div class="title" id="docTitle">Document</div>
      <div class="zoom">
        <button class="z" id="zoomOut">−</button>
        <span class="zval" id="zoomVal">Fit</span>
        <button class="z" id="zoomIn">+</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="loader" id="loading">Loading pages…</div>
    </div>
  </div>
</div>
<script src="/pdfjs/pdf.min.js"></script>
<script>
const token = location.pathname.split('/')[2];
const nameEl = document.getElementById('name');
const btn = document.getElementById('btn');
const statusEl = document.getElementById('status');
let pollTimer = null;
let renderedPdf = null;

btn.onclick = async () => {
  const name = nameEl.value.trim();
  if (!name) { statusEl.textContent = 'Please enter your name.'; return; }
  btn.disabled = true;
  statusEl.textContent = 'Requesting access...';
  try {
    const res = await fetch('/api/request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, name })
    });
    if (!res.ok) { statusEl.textContent = 'Link not found or revoked.'; return; }
    const data = await res.json();
    statusEl.textContent = 'Waiting for the owner to approve your request...';
    pollTimer = setInterval(() => poll(data.request_id), 4000);
    poll(data.request_id);
  } catch (e) {
    statusEl.textContent = 'Something went wrong. Try again.';
    btn.disabled = false;
  }
};

async function poll(requestId) {
  try {
    const res = await fetch(`/api/status/${token}/${requestId}`);
    if (!res.ok) return;
    const data = await res.json();
    if (data.status === 'approved') {
      clearInterval(pollTimer);
      showDocument(data.pdf, data.pages.length);
    } else if (data.status === 'declined') {
      clearInterval(pollTimer);
      statusEl.className = 'denied';
      statusEl.textContent = 'Access was declined by the owner.';
    }
  } catch (e) {}
}

let scale = 1;
async function showDocument(pdfUrl, totalPages) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('viewerWrap').style.display = 'block';
  const viewer = document.getElementById('viewer');
  const loading = document.getElementById('loading');
  viewer.innerHTML = '';
  viewer.appendChild(loading);

  pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';
  try {
    renderedPdf = await pdfjsLib.getDocument(pdfUrl).promise;
    const pageCount = renderedPdf.numPages;
    loading.remove();
    for (let i = 1; i <= pageCount; i++) {
      const item = document.createElement('div');
      item.className = 'page';
      item.style.maxWidth = `${560 * scale}px`;

      const canvas = document.createElement('canvas');
      item.appendChild(canvas);

      const num = document.createElement('div');
      num.className = 'page-num';
      num.textContent = `${i} / ${pageCount}`;
      item.appendChild(num);

      viewer.appendChild(item);
      await renderPage(renderedPdf, i, canvas);
    }
  } catch (e) {
    loading.textContent = 'Failed to load the document.';
    console.error(e);
  }
}

async function renderPage(pdf, pageNumber, canvas) {
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale: 1.5 * scale });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

document.getElementById('zoomIn').onclick = () => applyZoom(scale * 1.2);
document.getElementById('zoomOut').onclick = () => applyZoom(scale / 1.2);

function applyZoom(next) {
  scale = Math.min(2.5, Math.max(0.5, next));
  document.querySelectorAll('.page').forEach(p => p.style.maxWidth = `${560 * scale}px`);
  document.getElementById('zoomVal').textContent = `${Math.round(scale * 100)}%`;
}

nameEl.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });
</script>
</body>
</html>
