<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure document</title>
<script src="/static/auth-google.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c12;
    --panel: rgba(22, 26, 36, .96);
    --panel-solid: #161a24;
    --panel2: #1e2330;
    --border: rgba(255,255,255,.08);
    --text: #eef1f7;
    --muted: #98a2b3;
    --accent: #5b8cff;
    --accent2: #8b5cff;
    --accent3: #2fd9c3;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #ff6b6b;
    --radius: 18px;
    --shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Static aurora background (GPU-cheap gradients, no blurred/animated divs) */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(60% 50% at 80% -10%, rgba(91,140,255,.20), transparent 60%),
      radial-gradient(50% 45% at 10% 10%, rgba(139,92,255,.16), transparent 60%),
      radial-gradient(60% 60% at 50% 120%, rgba(47,217,195,.10), transparent 60%),
      var(--bg);
  }

  /* Entrance animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  .anim { animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both; }

  /* Navbar */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,12,18,.95);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { max-width: 980px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  .logo .mark {
    width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 20px rgba(91,140,255,.4); font-size: 15px;
  }
  .logo .n { background: linear-gradient(90deg, var(--accent), var(--accent3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 600; position: relative; transition: color .2s; }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -6px; width: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px;
    transition: width .25s ease;
  }
  .nav-links a:hover { color: var(--text); }
  .nav-links a:hover::after { width: 100%; }

  .wrap {
    max-width: 900px; margin: 0 auto; padding: 16px;
    flex: 1; width: 100%; display: flex; flex-direction: column; overflow-y: auto;
  }

  /* Themed scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(91,140,255,.45), rgba(139,92,255,.45));
    border-radius: 999px; border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--accent), var(--accent2)); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: rgba(91,140,255,.55) transparent; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    box-shadow: var(--shadow);
    text-align: center;
    width: 100%; max-width: 470px; margin: auto;
    position: relative; overflow: hidden;
    animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both;
  }
  .panel::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  .panel .shield {
    width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(91,140,255,.4); animation: popIn .5s .1s cubic-bezier(.22,.68,.36,1) both;
  }
  .panel h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.4px; }
  .panel p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }

  /* Tabs with sliding indicator */
  .tabs { position: relative; display: flex; margin-bottom: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .tab {
    flex: 1; padding: 9px; background: transparent; color: var(--muted); border: 0; border-radius: 9px;
    font-size: 13px; font-weight: 700; cursor: pointer; transition: color .25s; position: relative; z-index: 1;
  }
  .tab.active { color: #fff; }
  .tab-ink {
    position: absolute; top: 4px; bottom: 4px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 18px rgba(91,140,255,.4);
    transition: left .3s cubic-bezier(.22,.68,.36,1), width .3s cubic-bezier(.22,.68,.36,1);
  }

  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 11px 14px; background: rgba(255,255,255,.05);
    border: 1px solid var(--border); border-radius: 12px; font-size: 15px; color: var(--text);
    margin-bottom: 10px; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,140,255,.15); background: rgba(255,255,255,.07); }
  input::placeholder { color: var(--muted); }

  button {
    padding: 11px; border: 0; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; width: 100%; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 24px rgba(91,140,255,.35);
    transition: transform .18s, box-shadow .25s, filter .2s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(91,140,255,.45); filter: brightness(1.06); }
  button:active { transform: translateY(0) scale(.985); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  button::after {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    transform: translateX(-100%);
  }
  button:hover::after { animation: shimmer .8s ease; }
  .status { margin-top: 14px; color: var(--muted); font-size: 13px; min-height: 18px; }
  .denied { margin-top: 14px; color: var(--bad); font-weight: 600; }

  .gsep { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
  .gsep::before, .gsep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .ggl {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #fff; color: #1f2933; border: 1px solid var(--border);
  }
  .ggl:hover { background: #f3f4f6; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

  .acct { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 13px; color: var(--muted); }
  .acct .who { font-weight: 700; color: var(--text); }
  .acct button {
    width: auto; padding: 7px 14px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; cursor: pointer; transition: all .2s;
  }
  .acct button:hover { background: rgba(255,255,255,.1); transform: translateY(-1px); }

  .topbar {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    padding: 14px 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap;
    animation: fadeUp .5s cubic-bezier(.22,.68,.36,1) both;
  }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .zoom { display: flex; align-items: center; gap: 6px; }
  .topbar button.z { width: auto; padding: 7px 12px; font-size: 14px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); box-shadow: none; border-radius: 9px; }
  .topbar button.z:hover { background: rgba(255,255,255,.1); }
  .topbar button.z:disabled { opacity: .4; }
  .topbar .zval { min-width: 52px; text-align: center; font-size: 13px; color: var(--muted); }
  .topbar .right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .topbar button.dl { width: auto; padding: 9px 16px; font-size: 13px; }
  .topbar a.dl {
    display: inline-block; padding: 9px 16px; font-size: 13px; border-radius: 10px;
    background: linear-gradient(135deg, #16a34a, #0d9488); color: #fff; font-weight: 700; text-decoration: none;
    box-shadow: 0 6px 16px rgba(22,163,74,.3); transition: transform .18s, box-shadow .2s;
  }
  .topbar a.dl:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(22,163,74,.38); }
  .topbar .dlstatus { font-size: 12px; color: var(--muted); }

  .viewer {
    background: linear-gradient(180deg, #15181f, #101218); padding: 22px 8px 44px; border-radius: 16px;
    margin-top: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.4); animation: fadeUp .6s .1s cubic-bezier(.22,.68,.36,1) both;
  }
  .page {
    max-width: 560px; margin: 0 auto 22px; background: #fff;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); overflow: hidden; border-radius: 4px;
    animation: popIn .4s cubic-bezier(.22,.68,.36,1) both;
  }
  .page:last-child { margin-bottom: 0; }
  .page canvas { width: 100%; display: block; height: auto; }
  .page-num { text-align: center; color: #8b929c; font-size: 12px; padding-top: 12px; }

  .loader {
    text-align: center; color: #98a2b3; padding: 24px 0; font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .loader::before {
    content: ''; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    html { scroll-behavior: auto; }
  }

  @media (max-width: 640px) {
    .nav-inner { padding: 12px 16px; }
    .logo { font-size: 16px; }
    .logo .mark { width: 30px; height: 30px; font-size: 14px; }
    .panel { padding: 20px 16px; }
    .viewer { padding: 14px 0 26px; }
    .page { border-radius: 0; }
  }
  @media (max-height: 700px) {
    .panel p { display: none; }
    .panel h1 { margin-bottom: 10px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-inner">
      <div class="logo"><span class="mark">📚</span> Documents for <span class="n">Nerds</span></div>
      <nav class="nav-links">
        <a href="/">Home</a>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div class="panel" id="gate">
      <div class="shield">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.25 3.4 10.1 8 11 4.6-.9 8-5.75 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h1>Secure document</h1>
      <p id="gateDesc">This document is access-controlled. Create an account or log in to request access from the owner.</p>

      <div id="authView">
        <div class="tabs">
          <div class="tab-ink" id="tabInk"></div>
          <button class="tab active" id="tabLogin" onclick="switchTab('login')">Log in</button>
          <button class="tab" id="tabRegister" onclick="switchTab('register')">Create account</button>
        </div>

        <div id="loginPane">
          <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
          <button id="btnLogin">Log in</button>
          <div style="margin-top:6px;">
            <a href="#" onclick="showForgot(); return false;" style="color:var(--muted); font-size:12px; text-decoration:underline;">Forgot password?</a>
          </div>
          <div id="forgotPane" style="display:none; margin-top:12px; border-top:1px solid var(--border); padding-top:12px;">
            <input type="email" id="forgotEmail" placeholder="Your account email" autocomplete="email">
            <button id="btnForgot" type="button">Get a reset code</button>
            <div style="margin-top:10px; color:var(--muted); font-size:12px; line-height:1.5;" id="forgotMsg"></div>
          </div>
        </div>

        <div id="registerPane" style="display:none">
          <input type="text" id="regName" placeholder="Your name" autocomplete="name">
          <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
          <input type="password" id="regPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
          <button id="btnRegister">Create account</button>
        </div>

        <div class="gsep"><span>or continue with</span></div>
        <div id="googleBtn" style="display:flex;justify-content:center;margin:4px 0 12px"></div>

        <div class="status" id="authStatus"></div>
      </div>

      <div id="reqView" style="display:none">
        <div class="acct">
          <span>Signed in as <span class="who" id="acctName"></span></span>
          <button onclick="logout()">Log out</button>
        </div>
        <button id="btn">Request access</button>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div id="viewerWrap" style="display:none">
      <div class="topbar">
        <div class="title" id="docTitle">Document</div>
        <div class="right">
          <span class="dlstatus" id="dlStatus"></span>
          <span id="dlArea"></span>
          <span class="zoom">
            <button class="z" id="zoomOut">−</button>
            <span class="zval" id="zoomVal">Fit</span>
            <button class="z" id="zoomIn">+</button>
          </span>
        </div>
      </div>
      <div class="viewer" id="viewer">
        <div class="loader" id="loading">Loading pages…</div>
      </div>
    </div>
  </div>
<script src="/pdfjs/pdf.min.js"></script>
<script>
const token = location.pathname.split('/')[2];
const statusEl = document.getElementById('status');
const authStatusEl = document.getElementById('authStatus');
let pollTimer = null;
let renderedPdf = null;
let dlPollTimer = null;
let isOpen = false;

const AUTH_KEY = 'brion_auth';

function getAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
}
function setAuth(auth) { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
function authHeaders() {
  const auth = getAuth();
  return { 'Content-Type': 'application/json', ...(auth ? { Authorization: 'Bearer ' + auth.token } : {}) };
}

fetch('/api/site').then(r => r.json()).then(s => {
  if (window.initGoogleAuth) {
    initGoogleAuth(s, (data) => {
      setAuth({ token: data.token, name: data.name });
      showAuthUI();
    });
  }
}).catch(() => {});

fetch('/api/documents').then(r => r.json()).then(docs => {
  const d = docs.find(x => x.token === token);
  if (d && d.access_mode === 'open') {
    isOpen = true;
    document.getElementById('gateDesc').textContent = 'This document is open — no approval needed. Log in to view and download.';
  }
}).catch(() => {});

function switchTab(which) {
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabRegister').classList.toggle('active', which === 'register');
  document.getElementById('loginPane').style.display = which === 'login' ? '' : 'none';
  document.getElementById('registerPane').style.display = which === 'register' ? '' : 'none';
  authStatusEl.textContent = '';
  moveTabInk(which);
}

function moveTabInk(which) {
  const ink = document.getElementById('tabInk');
  if (!ink) return;
  const tab = document.getElementById(which === 'login' ? 'tabLogin' : 'tabRegister');
  ink.style.left = tab.offsetLeft + 'px';
  ink.style.width = tab.offsetWidth + 'px';
}
window.addEventListener('resize', () => {
  const active = document.querySelector('#authView .tab.active');
  if (active) moveTabInk(active.id === 'tabLogin' ? 'login' : 'register');
});

function showForgot() {
  const pane = document.getElementById('forgotPane');
  pane.style.display = pane.style.display === 'none' ? '' : 'none';
}

document.getElementById('btnForgot').onclick = async () => {
  const email = document.getElementById('forgotEmail').value.trim();
  const msg = document.getElementById('forgotMsg');
  if (!email) { msg.textContent = 'Enter your email.'; return; }
  msg.textContent = 'Working...';
  try {
    const res = await fetch('/api/forgot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.textContent = data.detail || 'Something went wrong.'; return; }
    msg.innerHTML = '<b>Your reset code:</b> <span style="font-size:18px; letter-spacing:2px; color:var(--accent);">' + data.code + '</span><br>' +
      data.hint + '<br>Valid for ' + data.expires_hours + ' hours.';
  } catch (e) {
    msg.textContent = 'Network error. Try again.';
  }
};

function showAuthUI() {
  const auth = getAuth();
  document.getElementById('authView').style.display = auth ? 'none' : '';
  document.getElementById('reqView').style.display = auth ? '' : 'none';
  if (auth) {
    document.getElementById('acctName').textContent = auth.name;
    document.getElementById('btn').disabled = false;
    statusEl.textContent = '';
    resumeIfApproved();
  }
}

async function resumeIfApproved() {
  try {
    const res = await fetch(`/api/my/status/${token}`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) return;
    const s = await res.json();
    isOpen = s.open_access === true;
    const gateDesc = document.getElementById('gateDesc');
    const btnEl = document.getElementById('btn');
    if (isOpen) {
      gateDesc.textContent = 'This document is open — no approval needed.';
    } else {
      gateDesc.textContent = 'This document is access-controlled. Create an account or log in to request access from the owner.';
    }
    if (s.view_approved && s.view_pdf) {
      clearInterval(pollTimer);
      showDocument(s.view_pdf, 0);
      if (s.download_approved && s.download_url) {
        document.getElementById('dlStatus').textContent = 'Your file is ready.';
        document.getElementById('dlArea').innerHTML = `<a class="dl" href="#" onclick="downloadPdf('${s.download_url}'); return false;">Download PDF</a>`;
      } else if (s.pending_download) {
        document.getElementById('dlStatus').textContent = isOpen ? 'Preparing your download…' : 'Waiting for owner approval to download…';
        document.getElementById('dlArea').innerHTML = '<button class="dl" disabled>Waiting…</button>';
        dlPollTimer = setInterval(() => pollDownload(s.pending_download), 4000);
        pollDownload(s.pending_download);
      } else {
        renderDlButton();
      }
      return;
    }
    if (isOpen) {
      statusEl.textContent = 'Opening document…';
      btnEl.disabled = true;
      openDocument();
      return;
    }
    btnEl.textContent = 'Request access';
    if (s.pending_view) {
      statusEl.textContent = 'Waiting for the owner to approve your request...';
      pollTimer = setInterval(() => poll(s.pending_view), 4000);
      poll(s.pending_view);
    }
  } catch (e) {}
}

async function submitAuth(path, body) {
  authStatusEl.textContent = 'Working...';
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      authStatusEl.textContent = err.detail || 'Something went wrong.';
      return;
    }
    const data = await res.json();
    setAuth({ token: data.token, name: data.name });
    showAuthUI();
  } catch (e) {
    authStatusEl.textContent = 'Network error. Try again.';
  }
}

document.getElementById('btnLogin').onclick = () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { authStatusEl.textContent = 'Enter your email and password.'; return; }
  submitAuth('/api/login', { email, password });
};

document.getElementById('btnRegister').onclick = () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) { authStatusEl.textContent = 'Fill in all fields.'; return; }
  submitAuth('/api/register', { name, email, password });
};

function logout() {
  localStorage.removeItem(AUTH_KEY);
  showAuthUI();
}

const btn = document.getElementById('btn');
btn.onclick = () => openDocument();

async function openDocument() {
  btn.disabled = true;
  statusEl.textContent = isOpen ? 'Opening document…' : 'Requesting access...';
  try {
    const res = await fetch('/api/request', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ token })
    });
    if (res.status === 401) { logout(); statusEl.textContent = 'Please log in again.'; return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      statusEl.textContent = err.detail || 'Link not found or revoked.';
      btn.disabled = false;
      return;
    }
    const data = await res.json();
    statusEl.textContent = isOpen ? 'Opening document…' : 'Waiting for the owner to approve your request...';
    pollTimer = setInterval(() => poll(data.request_id), 4000);
    poll(data.request_id);
  } catch (e) {
    statusEl.textContent = 'Something went wrong. Try again.';
    btn.disabled = false;
  }
}

async function poll(requestId) {
  try {
    const res = await fetch(`/api/status/${token}/${requestId}`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) return;
    const data = await res.json();
    if (data.status === 'approved') {
      clearInterval(pollTimer);
      showDocument(data.pdf, data.pages.length);
    } else if (data.status === 'declined') {
      clearInterval(pollTimer);
      statusEl.className = 'denied';
      statusEl.textContent = 'Access was declined by the owner.';
      btn.disabled = false;
    }
  } catch (e) {}
}

let scale = 1;
async function showDocument(pdfUrl, totalPages) {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('viewerWrap').style.display = 'block';
  renderDlButton();
  const viewer = document.getElementById('viewer');
  const loading = document.getElementById('loading');
  viewer.innerHTML = '';
  viewer.appendChild(loading);

  pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';
  try {
    renderedPdf = await pdfjsLib.getDocument({ url: pdfUrl, httpHeaders: authHeaders() }).promise;
    const pageCount = renderedPdf.numPages;
    loading.remove();
    for (let i = 1; i <= pageCount; i++) {
      const item = document.createElement('div');
      item.className = 'page';
      item.style.maxWidth = `${560 * scale}px`;

      const canvas = document.createElement('canvas');
      item.appendChild(canvas);

      const num = document.createElement('div');
      num.className = 'page-num';
      num.textContent = `${i} / ${pageCount}`;
      item.appendChild(num);

      viewer.appendChild(item);
      await renderPage(renderedPdf, i, canvas);
    }
  } catch (e) {
    loading.textContent = 'Failed to load the document.';
    console.error(e);
  }
}

async function renderPage(pdf, pageNumber, canvas) {
  const page = await pdf.getPage(pageNumber);
  const viewport = page.getViewport({ scale: 1.5 * scale });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

document.getElementById('zoomIn').onclick = () => applyZoom(scale * 1.2);
document.getElementById('zoomOut').onclick = () => applyZoom(scale / 1.2);

function applyZoom(next) {
  scale = Math.min(2.5, Math.max(0.5, next));
  document.querySelectorAll('.page').forEach(p => p.style.maxWidth = `${560 * scale}px`);
  document.getElementById('zoomVal').textContent = `${Math.round(scale * 100)}%`;
}

async function requestDownload() {
  const dlArea = document.getElementById('dlArea');
  const dlStatus = document.getElementById('dlStatus');
  dlArea.innerHTML = '<button class="dl" disabled>Requesting…</button>';
  dlStatus.textContent = '';
  try {
    const res = await fetch('/api/download/request', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ token })
    });
    if (!res.ok) { dlStatus.textContent = isOpen ? 'Download failed.' : 'Download request failed.'; renderDlButton(); return; }
    const data = await res.json();
    dlStatus.textContent = isOpen ? 'Preparing your download…' : 'Waiting for owner approval to download…';
    dlArea.innerHTML = '<button class="dl" disabled>Preparing…</button>';
    dlPollTimer = setInterval(() => pollDownload(data.request_id), 4000);
    pollDownload(data.request_id);
  } catch (e) {
    dlStatus.textContent = isOpen ? 'Download failed.' : 'Download request failed.';
    renderDlButton();
  }
}

function renderDlButton() {
  document.getElementById('dlArea').innerHTML = '<button class="dl" onclick="requestDownload()">Download PDF</button>';
}

async function downloadPdf(url) {
  try {
    const res = await fetch(url, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) return;
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'document.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  } catch (e) {}
}

async function pollDownload(requestId) {
  try {
    const res = await fetch(`/api/download/status/${token}/${requestId}`, { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) return;
    const data = await res.json();
    if (data.status === 'approved') {
      clearInterval(dlPollTimer);
      document.getElementById('dlStatus').textContent = 'Your file is ready.';
      document.getElementById('dlArea').innerHTML = `<a class="dl" href="#" onclick="downloadPdf('${data.download_url}'); return false;">Download PDF</a>`;
    } else if (data.status === 'declined') {
      clearInterval(dlPollTimer);
      document.getElementById('dlStatus').textContent = 'Download was declined.';
      renderDlButton();
    }
  } catch (e) {}
}

showAuthUI();
moveTabInk('login');
