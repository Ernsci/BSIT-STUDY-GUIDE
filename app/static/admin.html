<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document control · Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c12;
    --panel: rgba(22, 26, 36, .96);
    --panel2: #1e2330;
    --border: rgba(255,255,255,.08);
    --text: #eef1f7;
    --muted: #98a2b3;
    --accent: #5b8cff;
    --accent2: #8b5cff;
    --good: #34d399;
    --warn: #fbbf24;
    --bad: #ff6b6b;
    --radius: 18px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  }

  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: radial-gradient(55% 45% at 85% -5%, rgba(91,140,255,.2), transparent 60%), radial-gradient(45% 40% at 5% 0%, rgba(139,92,255,.16), transparent 60%), var(--bg); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .anim { animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both; }

  .nav { position: sticky; top: 0; z-index: 20; background: rgba(10,12,18,.95); border-bottom: 1px solid var(--border); }
  .nav-inner { max-width: 980px; margin: 0 auto; padding: 16px 22px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  .logo .mark { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 18px rgba(91,140,255,.4); }
  .logo .n { color: var(--accent); }
  .logo .tag { font-size: 11px; color: var(--muted); font-weight: 600; margin-left: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: rgba(255,255,255,.04); vertical-align: middle; }

  .wrap {
    max-width: 980px; margin: 0 auto; padding: 18px 22px;
    flex: 1; width: 100%; display: flex; overflow-y: auto;
  }
  .shell { margin: auto; width: 100%; }

  /* Themed scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(91,140,255,.45), rgba(139,92,255,.45));
    border-radius: 999px; border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--accent), var(--accent2)); }
  ::-webkit-scrollbar-corner { background: transparent; }
  * { scrollbar-width: thin; scrollbar-color: rgba(91,140,255,.55) transparent; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .panel + .panel { margin-top: 12px; }
  .panel h2 { font-size: 15px; font-weight: 800; letter-spacing: .3px; margin-bottom: 12px; }
  .panel h2 .sub { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 8px; }

  #login { max-width: 460px; text-align: center; }
  #login .shield { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 16px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(91,140,255,.35); animation: popIn .5s .1s cubic-bezier(.22,.68,.36,1) both; }
  #login h2 { font-size: 20px; font-weight: 800; margin-bottom: 4px; letter-spacing: -.4px; }
  #login p { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  #login form { text-align: left; }

  input[type=password], input[type=file], input[type=text] {
    width: 100%; padding: 11px 14px; background: rgba(255,255,255,.05); border: 1px solid var(--border);
    border-radius: 12px; font-size: 15px; color: var(--text); margin-bottom: 10px; outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,140,255,.15); background: rgba(255,255,255,.07); }
  input::placeholder { color: var(--muted); }

  input[type=file] { padding: 24px 16px; border: 1.5px dashed var(--border); background: rgba(255,255,255,.03); border-radius: 14px; cursor: pointer; font-size: 13px; color: var(--muted); text-align: center; transition: border-color .2s, background .2s; }
  input[type=file]::file-selector-button { display: none; }
  input[type=file].has-file { border-color: var(--good); color: var(--good); background: rgba(52,211,153,.06); }

  button {
    padding: 11px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 8px 22px rgba(91,140,255,.35); transition: transform .18s, box-shadow .25s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(91,140,255,.45); }
  button:active { transform: translateY(0) scale(.985); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  button::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); }
  button:hover::after { animation: shimmer .8s ease; }
  button.secondary { width: auto; padding: 9px 16px; font-size: 13px; background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); box-shadow: none; }
  button.secondary:hover { background: rgba(255,255,255,.1); box-shadow: none; }
  button.danger { width: auto; padding: 9px 16px; font-size: 13px; background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.4); color: var(--bad); box-shadow: none; }
  button.danger:hover { background: rgba(255,107,107,.2); box-shadow: none; }

  .row { display: flex; gap: 10px; align-items: center; }
  .row button { flex: 1; }

  .msg { margin-top: 12px; font-size: 13px; color: var(--muted); word-break: break-all; animation: fadeUp .4s ease both; }
  .msg.good { color: var(--good); }
  .msg.bad { color: var(--bad); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
    transition: transform .2s, border-color .2s; animation: fadeUp .5s ease both;
  }
  .stat:hover { transform: translateY(-3px); border-color: rgba(91,140,255,.4); }
  .stat .num { font-size: 28px; font-weight: 800; line-height: 1.1; }
  .stat .label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .stat.active .num { color: var(--good); }
  .stat.revoked .num { color: var(--bad); }

  .doc {
    display: flex; justify-content: space-between; align-items: center; padding: 16px 4px;
    border-bottom: 1px solid var(--border); gap: 12px; animation: fadeUp .4s ease both;
  }
  .doc:first-of-type { padding-top: 2px; }
  .doc:last-of-type { border-bottom: 0; padding-bottom: 2px; }
  .doc .title { font-weight: 700; font-size: 15px; }
  .doc .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .doc .meta a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .doc .meta a:hover { text-decoration: underline; }
  .doc .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 999px; letter-spacing: .3px; }
  .badge.active { background: rgba(52,211,153,.15); color: var(--good); }
  .badge.revoked { background: rgba(255,107,107,.15); color: var(--bad); }

  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }

  .hidden { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

  @media (max-width: 640px) {
    .nav-inner { padding: 12px 16px; }
    .wrap { padding: 14px 16px; }
    .stats { grid-template-columns: 1fr; }
    .doc { flex-direction: column; align-items: flex-start; gap: 10px; }
    .doc .actions { align-self: stretch; justify-content: flex-end; }
    .doc .actions .secondary, .doc .actions .danger { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="nav">
    <div class="nav-inner">
      <div class="logo"><span class="mark">🛡️</span> Documents for <span class="n">Nerds</span><span class="tag">Admin</span></div>
      <button class="secondary logout" id="logoutBtn" style="display:none;width:auto" onclick="doLogout()">Log out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="shell">
    <div class="panel anim" id="login">
      <div class="shield">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.25 3.4 10.1 8 11 4.6-.9 8-5.75 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      </div>
      <h2>Document control</h2>
      <p>Enter the admin password to manage protected documents.</p>
      <form onsubmit="login(event)">
        <input type="password" id="password" placeholder="Admin password" autofocus>
        <button type="submit">Log in</button>
      </form>
      <div class="msg bad" id="loginMsg"></div>
    </div>

    <div class="panel hidden anim-2" id="app">
      <h2>Upload a PDF <span class="sub">Protected &amp; watermarked</span></h2>
      <input type="file" id="file" accept=".pdf" onchange="onFilePick(event)">
      <button id="uploadBtn" onclick="upload()">Upload &amp; protect</button>
      <div class="msg" id="uploadMsg"></div>
    </div>

    <div class="stats hidden" id="statsRow"></div>

    <div class="panel hidden anim-3" id="docsCard">
      <h2>Your documents <span class="sub">Share each link to give access</span></h2>
      <div id="docs"></div>
    </div>

    <div class="panel hidden anim-4" id="resetCard">
      <h2>Password reset <span class="sub">Give a reset link to a user who sent you their code</span></h2>
      <input type="text" id="resetCode" placeholder="Reset code from the user">
      <button id="resetBtn" onclick="makeResetLink()">Generate reset link</button>
      <div class="msg" id="resetMsg"></div>
      <div class="msg" id="resetOut"></div>
    </div>
    </div>
  </div>

<script>
function login(e) {
  e.preventDefault();
  const fd = new FormData();
  fd.append('password', document.getElementById('password').value);
  fetch('/api/admin/login', { method: 'POST', body: fd, headers: { 'X-Requested-With': 'XMLHttpRequest' } }).then(async res => {
    if (res.ok) showApp();
    else document.getElementById('loginMsg').textContent = 'Wrong password.';
  });
}

function showApp() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('docsCard').classList.remove('hidden');
  document.getElementById('resetCard').classList.remove('hidden');
  document.getElementById('statsRow').classList.remove('hidden');
  document.getElementById('logoutBtn').style.display = 'inline-block';
  loadDocs();
}

async function makeResetLink() {
  const code = document.getElementById('resetCode').value.trim();
  const msg = document.getElementById('resetMsg');
  const out = document.getElementById('resetOut');
  msg.className = 'msg';
  out.className = 'msg';
  out.textContent = '';
  if (!code) { msg.textContent = 'Enter the code.'; return; }
  msg.textContent = 'Working...';
  try {
    const res = await fetch('/api/admin/reset-link', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
      body: JSON.stringify({ code })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { msg.className = 'msg bad'; msg.textContent = data.detail || 'Failed.'; return; }
    msg.className = 'msg';
    msg.textContent = 'Link for ' + data.email + ':';
    out.className = 'msg';
    out.innerHTML = '<a href="' + data.url + '" target="_blank" rel="noopener">' + data.url + '</a>';
    document.getElementById('resetCode').value = '';
  } catch (e) {
    msg.className = 'msg bad';
    msg.textContent = 'Network error.';
  }
}

async function doLogout() {
  await fetch('/api/admin/logout', { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } });
  location.reload();
}

function onFilePick(e) {
  const el = document.getElementById('file');
  el.classList.toggle('has-file', el.files.length > 0);
}

async function upload() {
  const fileEl = document.getElementById('file');
  if (!fileEl.files.length) return;
  const msg = document.getElementById('uploadMsg');
  const btn = document.getElementById('uploadBtn');
  const fd = new FormData();
  fd.append('document', fileEl.files[0]);
  msg.className = 'msg';
  msg.textContent = 'Uploading and rendering pages…';
  btn.disabled = true;
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd, headers: { 'X-Requested-With': 'XMLHttpRequest' } });
    const data = await res.json();
    if (!res.ok) { msg.className = 'msg bad'; msg.textContent = data.detail || 'Upload failed.'; return; }
    const link = `${location.origin}/v/${data.token}`;
    msg.className = 'msg good';
    msg.innerHTML = `Protected. Share this link: <a href="${link}" target="_blank" style="color:var(--good)">${link}</a>`;
    fileEl.value = '';
    fileEl.classList.remove('has-file');
    loadDocs();
  } catch (e) {
    msg.className = 'msg bad';
    msg.textContent = 'Upload failed.';
  } finally {
    btn.disabled = false;
  }
}

async function loadDocs() {
  const res = await fetch('/api/admin/documents');
  if (!res.ok) return;
  const docs = await res.json();
  const el = document.getElementById('docs');
  el.innerHTML = '';
  if (!docs.length) { el.innerHTML = '<div class="empty">No documents yet — upload one above.</div>'; return; }

  const active = docs.filter(d => d.status === 'active').length;
  const revoked = docs.filter(d => d.status !== 'active').length;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat"><div class="num">${docs.length}</div><div class="label">Total documents</div></div>
    <div class="stat active"><div class="num">${active}</div><div class="label">Active</div></div>
    <div class="stat revoked"><div class="num">${revoked}</div><div class="label">Revoked</div></div>`;

  for (const d of docs) {
    const row = document.createElement('div');
    row.className = 'doc';
    const badge = `<span class="badge ${d.status}">${d.status}</span>`;
    const link = `<a href="/v/${d.token}" target="_blank">/v/${d.token}</a>`;
    row.innerHTML = `
      <div>
        <div class="title">${d.title}</div>
        <div class="meta">${d.page_count} pages · ${link}</div>
      </div>
      <div class="actions">
        ${badge}
        <span id="actions-${d.id}">
          ${d.status === 'active' ? '<button class="secondary" onclick="toggleActions(' + d.id + ')">Revoke</button>' : ''}
          <button class="secondary" onclick="copyLink('${d.token}')">Copy link</button>
        </span>
        <span id="confirm-${d.id}" class="hidden">
          <button class="secondary" onclick="disableDoc(${d.id})">Disable</button>
          <button class="danger" onclick="deleteDoc(${d.id})">Delete</button>
        </span>
      </div>`;
    el.appendChild(row);
  }
}

function toggleActions(id) {
  document.getElementById('actions-' + id).classList.add('hidden');
  document.getElementById('confirm-' + id).classList.remove('hidden');
}

function copyLink(token) {
  const link = `${location.origin}/v/${token}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(() => flash('Link copied to clipboard.')).catch(() => flash(link));
  } else {
    flash(link);
  }
}

let flashTimer = null;
function flash(text) {
  const el = document.getElementById('uploadMsg');
  el.className = 'msg good';
  el.textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { el.textContent = ''; }, 2500);
}

async function disableDoc(id) {
  await fetch(`/api/admin/revoke/${id}`, { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } });
  loadDocs();
}

async function deleteDoc(id) {
  if (!confirm('Permanently delete this document and all its data?')) return;
  await fetch(`/api/admin/delete/${id}`, { method: 'POST', headers: { 'X-Requested-With': 'XMLHttpRequest' } });
  loadDocs();
}

(async () => {
  const res = await fetch('/api/admin/documents');
  if (res.ok) showApp();
})();
</script>
</body>
</html>
