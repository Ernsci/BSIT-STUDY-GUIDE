<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents for Nerds · Login required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --accent2: #7c5cff;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; max-width: 380px; width: 100%; text-align: center; }
  .icon { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 26px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  a.btn { display: block; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; transition: opacity .15s; }
  a.btn:hover { opacity: .9; }
  a.back { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>YOU NEED TO LOGIN</h1>
    <p>Please log in to your account to view and request documents.</p>
    <a class="btn" href="/">Back to home</a>
    <a class="back" href="/">← Return to the dashboard</a>
  </div>
</body>
</html>
