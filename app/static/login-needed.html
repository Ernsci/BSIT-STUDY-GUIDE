<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents for Nerds · Login required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c12;
    --panel: rgba(22, 26, 36, .96);
    --border: rgba(255,255,255,.08);
    --text: #eef1f7;
    --muted: #98a2b3;
    --accent: #5b8cff;
    --accent2: #8b5cff;
    --accent3: #2fd9c3;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background:
    radial-gradient(60% 50% at 80% -10%, rgba(91,140,255,.20), transparent 60%),
    radial-gradient(50% 45% at 10% 10%, rgba(139,92,255,.16), transparent 60%),
    radial-gradient(60% 60% at 50% 120%, rgba(47,217,195,.10), transparent 60%),
    var(--bg);
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { 100% { transform: translateX(100%); } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    max-width: 520px; width: 100%; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both;
  }
  .card::before { content: ''; display: block; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); }
  .video-wrap { position: relative; background: #000; overflow: hidden; }
  video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
  .body { padding: 24px; text-align: center; }
  .icon {
    width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 12px; font-size: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(91,140,255,.35);
    animation: popIn .5s .1s cubic-bezier(.22,.68,.36,1) both;
  }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 6px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  a.btn {
    display: block; padding: 12px; border: 0; border-radius: 12px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 8px 22px rgba(91,140,255,.35); transition: transform .18s, box-shadow .25s;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(91,140,255,.45); }
  a.btn::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); }
  a.btn:hover::after { animation: shimmer .8s ease; }
  a.back { display: inline-block; margin-top: 12px; color: var(--muted); font-size: 13px; text-decoration: none; transition: color .2s; }
  a.back:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 480px) {
    .card { border-radius: 16px; }
    .body { padding: 20px 16px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="card">
    <div class="video-wrap">
      <video id="vid" autoplay loop playsinline>
        <source src="/static/video.mp4" type="video/mp4">
      </video>
    </div>
    <div class="body">
      <div class="icon">💔</div>
      <h1>MAG MOVE ON KANA</h1>
      <p>Please go study and mag move on kana</p>
      <a class="btn" href="/">Back to home</a>
      <a class="back" href="/">← Return to the dashboard</a>
    </div>
  </div>
  <script>
    const vid = document.getElementById('vid');
    vid.volume = 1.0;
    vid.muted = false;
    const play = () => { vid.play().catch(() => {}); };
    play();
    document.addEventListener('click', play, { once: true });
  </script>
</body>
</html>
