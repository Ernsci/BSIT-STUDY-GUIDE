<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents for Nerds · Sign in required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #4f8cff;
    --accent2: #7c5cff;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; max-width: 520px; width: 100%; overflow: hidden; }
  .hero { height: 120px; background: linear-gradient(135deg, rgba(79,140,255,.18), rgba(124,92,255,.18)), repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px); }
  .body { padding: 28px 28px 32px; text-align: center; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 22px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 8px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  a.btn { display: block; padding: 13px; border: 0; border-radius: 10px; background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 700; text-decoration: none; transition: opacity .15s; }
  a.btn:hover { opacity: .9; }
  a.back { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="hero"></div>
    <div class="body">
      <div class="icon">🔒</div>
      <h1>Sign in to view this document</h1>
      <p>This document is access-controlled. Log in or create an account to request access from the owner.</p>
      <a class="btn" href="/">Log in or create an account</a>
      <a class="back" href="/">← Return to the dashboard</a>
    </div>
  </div>
</body>
</html>
