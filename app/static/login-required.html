<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents for Nerds · Sign in required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c12;
    --panel: rgba(22, 26, 36, .85);
    --border: rgba(255,255,255,.08);
    --text: #eef1f7;
    --muted: #98a2b3;
    --accent: #5b8cff;
    --accent2: #8b5cff;
    --accent3: #2fd9c3;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background:
    radial-gradient(60% 50% at 80% -10%, rgba(91,140,255,.22), transparent 60%),
    radial-gradient(50% 45% at 10% 10%, rgba(139,92,255,.18), transparent 60%),
    radial-gradient(60% 60% at 50% 120%, rgba(47,217,195,.12), transparent 60%),
    var(--bg);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; animation: drift 18s ease-in-out infinite; }
  .orb.o1 { width: 420px; height: 420px; background: rgba(91,140,255,.35); top: -120px; left: -80px; }
  .orb.o2 { width: 380px; height: 380px; background: rgba(139,92,255,.3); top: 30%; right: -120px; animation-delay: -6s; }
  .orb.o3 { width: 460px; height: 460px; background: rgba(47,217,195,.22); bottom: -160px; left: 20%; animation-delay: -12s; }
  @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(40px,30px) scale(1.08); } 66% { transform: translate(-30px,-20px) scale(.94); } }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { 100% { transform: translateX(100%); } }

  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 20px;
    max-width: 520px; width: 100%; overflow: hidden; text-align: center;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both;
  }
  .card::before { content: ''; display: block; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3)); }
  .hero { height: 120px; background: linear-gradient(135deg, rgba(91,140,255,.18), rgba(139,92,255,.18)), repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 12px, transparent 12px 24px); }
  .body { padding: 24px; }
  .icon {
    width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 12px; font-size: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(91,140,255,.35);
    animation: popIn .5s .1s cubic-bezier(.22,.68,.36,1) both;
  }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -.4px; margin-bottom: 6px; }
  p { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  a.btn {
    display: block; padding: 12px; border: 0; border-radius: 12px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    font-size: 15px; font-weight: 700; text-decoration: none;
    box-shadow: 0 8px 22px rgba(91,140,255,.35); transition: transform .18s, box-shadow .25s;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(91,140,255,.45); }
  a.btn::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); }
  a.btn:hover::after { animation: shimmer .8s ease; }
  a.back { display: inline-block; margin-top: 12px; color: var(--muted); font-size: 13px; text-decoration: none; transition: color .2s; }
  a.back:hover { color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
  @media (max-width: 480px) {
    .card { border-radius: 16px; }
    .body { padding: 20px 16px; }
    .hero { height: 90px; }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb o1"></div>
    <div class="orb o2"></div>
    <div class="orb o3"></div>
  </div>
  <div class="card">
    <div class="hero"></div>
    <div class="body">
      <div class="icon">🔒</div>
      <h1>You're not the owner of this document's download link</h1>
      <p>Stay away, and far away.</p>
      <a class="btn" href="/docs">Log in to continue</a>
      <a class="back" href="/">← Return to the dashboard</a>
    </div>
  </div>
</body>
</html>
