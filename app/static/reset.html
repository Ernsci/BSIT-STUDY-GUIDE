<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --accent: #5b8cff;
    --accent2: #8b5cff;
    --border: #e5e9f0;
    --text: #1f2933;
    --muted: #64748b;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f3f6fb; color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 16px; flex: 1; width: 100%; display: flex; overflow-y: auto; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes popIn { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes shimmer { 100% { transform: translateX(100%); } }

  .card {
    background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 24px 60px rgba(31,41,51,.12);
    text-align: center; width: 100%; margin: auto; border: 1px solid rgba(255,255,255,.6); position: relative; overflow: hidden;
    animation: fadeUp .6s cubic-bezier(.22,.68,.36,1) both;
  }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .card .shield {
    width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(91,140,255,.35); animation: popIn .5s .1s cubic-bezier(.22,.68,.36,1) both;
  }
  .card h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.4px; }
  .card p { color: var(--muted); font-size: 13px; margin: 0 0 12px; }

  input[type=password] {
    width: 100%; padding: 11px 14px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; margin-bottom: 10px; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,140,255,.12); background: #fff; }

  button {
    width: 100%; padding: 11px; border: 0; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 8px 22px rgba(91,140,255,.3); transition: transform .18s, box-shadow .25s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(91,140,255,.4); }
  button:active { transform: translateY(0) scale(.985); }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
  button::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); }
  button:hover::after { animation: shimmer .8s ease; }

  .status { margin-top: 14px; color: var(--muted); font-size: 13px; min-height: 18px; animation: fadeUp .4s ease both; }
  .status.bad { color: #dc2626; }
  .status.good { color: #16a34a; font-weight: 700; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="shield">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <h1>Set a new password</h1>
    <p>Choose a new password for your account.</p>
    <input type="password" id="pw" placeholder="New password (min 6 chars)" autocomplete="new-password">
    <input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password">
    <button id="btn">Save new password</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const token = decodeURIComponent(location.pathname.replace(/^\/reset\//, ''));
const statusEl = document.getElementById('status');

document.getElementById('btn').onclick = async () => {
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;
  if (pw.length < 6) { statusEl.className = 'status bad'; statusEl.textContent = 'Password must be at least 6 characters.'; return; }
  if (pw !== pw2) { statusEl.className = 'status bad'; statusEl.textContent = 'Passwords do not match.'; return; }
  statusEl.className = 'status';
  statusEl.textContent = 'Working...';
  try {
    const res = await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { statusEl.className = 'status bad'; statusEl.textContent = data.detail || 'Reset failed.'; return; }
    statusEl.className = 'status good';
    statusEl.textContent = 'Password saved. You can now log in.';
    document.getElementById('btn').disabled = true;
  } catch (e) {
    statusEl.className = 'status bad';
    statusEl.textContent = 'Reset failed.';
  }
};
</script>
</body>
</html>
