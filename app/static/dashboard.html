<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRION · Documents</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f5f7fa; color: #1f2933; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #1f2933; margin: 0 0 4px; }
  .brand span { color: #1a73e8; }
  .sub { color: #52606d; font-size: 14px; margin: 0 0 20px; }

  .acct { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 14px; color: #52606d; }
  .acct .who { font-weight: 600; color: #1f2933; }
  .acct button { width: auto; padding: 6px 12px; font-size: 12px; background: #e4e7eb; color: #1f2933; }

  .tabs { display: flex; margin-bottom: 16px; }
  .tab { flex: 1; padding: 10px; background: #eef1f4; color: #52606d; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: #1a73e8; color: #fff; }
  .tab + .tab { margin-left: 8px; }
  input[type=text], input[type=email], input[type=password] { width: 100%; padding: 12px 14px; border: 1px solid #d3dce6; border-radius: 8px; font-size: 15px; margin-bottom: 12px; box-sizing: border-box; }
  button { padding: 12px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  button:disabled { background: #9aa5b1; cursor: not-allowed; }
  .status { margin-top: 14px; color: #52606d; font-size: 14px; }
  .status.bad { color: #c0392b; }

  .doc { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #eef1f4; gap: 12px; }
  .doc:last-child { border-bottom: 0; }
  .doc .title { font-weight: 600; font-size: 15px; }
  .doc .meta { font-size: 12px; color: #7b8794; margin-top: 2px; }
  .doc .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 12px; }
  .badge.approved { background: #e6f4ea; color: #137333; }
  .badge.pending { background: #fef3cd; color: #8a6d00; }
  .badge.declined { background: #fdecea; color: #c0392b; }
  .badge.none { background: #eef1f4; color: #52606d; }
  .doc a.open { display: inline-block; padding: 8px 14px; font-size: 13px; border-radius: 8px; background: #137333; color: #fff; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .doc button.act { width: auto; padding: 8px 14px; font-size: 13px; }
  .doc button.wait { width: auto; padding: 8px 14px; font-size: 13px; background: #e4e7eb; color: #1f2933; }
  .empty { color: #7b8794; font-size: 14px; padding: 12px 0; }
  .dlrow { margin-top: 6px; }
  .dlrow a { color: #137333; font-weight: 600; font-size: 12px; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand">BRION<span>.</span></div>
    <p class="sub" id="headline">Log in or create an account to view documents.</p>

    <div id="authView">
      <div class="tabs">
        <button class="tab active" id="tabLogin" onclick="switchTab('login')">Log in</button>
        <button class="tab" id="tabRegister" onclick="switchTab('register')">Create account</button>
      </div>
      <div id="loginPane">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button id="btnLogin">Log in</button>
      </div>
      <div id="registerPane" style="display:none">
        <input type="text" id="regName" placeholder="Your name" autocomplete="name">
        <input type="email" id="regEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="regPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
        <button id="btnRegister">Create account</button>
      </div>
      <div class="status" id="authStatus"></div>
    </div>

    <div id="docsView" style="display:none">
      <div class="acct">
        <span>Signed in as <span class="who" id="acctName"></span></span>
        <button onclick="logout()">Log out</button>
      </div>
      <div id="docs"></div>
    </div>
  </div>
</div>
<script>
const AUTH_KEY = 'brion_auth';

function getAuth() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
}
function setAuth(auth) { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); }
function authHeaders() {
  const auth = getAuth();
  return { 'Content-Type': 'application/json', ...(auth ? { Authorization: 'Bearer ' + auth.token } : {}) };
}

function switchTab(which) {
  document.getElementById('tabLogin').classList.toggle('active', which === 'login');
  document.getElementById('tabRegister').classList.toggle('active', which === 'register');
  document.getElementById('loginPane').style.display = which === 'login' ? '' : 'none';
  document.getElementById('registerPane').style.display = which === 'register' ? '' : 'none';
  document.getElementById('authStatus').textContent = '';
}

function showView() {
  const auth = getAuth();
  document.getElementById('authView').style.display = auth ? 'none' : '';
  document.getElementById('docsView').style.display = auth ? '' : 'none';
  if (auth) {
    document.getElementById('acctName').textContent = auth.name;
    loadDocs();
  }
}

async function submitAuth(path, body) {
  const statusEl = document.getElementById('authStatus');
  statusEl.className = 'status';
  statusEl.textContent = 'Working...';
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      statusEl.className = 'status bad';
      statusEl.textContent = err.detail || 'Something went wrong.';
      return;
    }
    const data = await res.json();
    setAuth({ token: data.token, name: data.name });
    showView();
  } catch (e) {
    statusEl.className = 'status bad';
    statusEl.textContent = 'Network error. Try again.';
  }
}

document.getElementById('btnLogin').onclick = () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { document.getElementById('authStatus').textContent = 'Enter your email and password.'; return; }
  submitAuth('/api/login', { email, password });
};
document.getElementById('btnRegister').onclick = () => {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!name || !email || !password) { document.getElementById('authStatus').textContent = 'Fill in all fields.'; return; }
  submitAuth('/api/register', { name, email, password });
};

function logout() {
  localStorage.removeItem(AUTH_KEY);
  showView();
}

async function loadDocs() {
  const el = document.getElementById('docs');
  el.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const res = await fetch('/api/my/documents', { headers: authHeaders() });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) { el.innerHTML = '<div class="empty">Could not load documents.</div>'; return; }
    const docs = await res.json();
    el.innerHTML = '';
    if (!docs.length) { el.innerHTML = '<div class="empty">No documents available yet.</div>'; return; }
    for (const d of docs) renderDoc(el, d);
  } catch (e) {
    el.innerHTML = '<div class="empty">Could not load documents.</div>';
  }
}

function statusBadge(status) {
  const map = { approved: 'Approved', pending: 'Waiting', declined: 'Declined', none: 'Not requested' };
  return `<span class="badge ${status}">${map[status] || status}</span>`;
}

function renderDoc(el, d) {
  const row = document.createElement('div');
  row.className = 'doc';
  const actions = document.createElement('div');
  actions.className = 'actions';

  const v = d.view, dl = d.download;

  if (v.status === 'approved') {
    actions.innerHTML += `<a class="open" href="/v/${d.token}" target="_blank">Open document</a>`;
  } else if (v.status === 'pending') {
    actions.innerHTML += `<button class="wait" disabled>Waiting…</button>`;
  } else {
    actions.innerHTML += `<button class="act" onclick="requestView('${d.token}')">Request view</button>`;
  }

  let dlHtml = '';
  if (dl.status === 'approved') {
    dlHtml = `<div class="dlrow">Download: <a href="${dl.url}" download>PDF</a></div>`;
  } else if (dl.status === 'pending') {
    dlHtml = `<div class="dlrow"><span class="badge pending">Download waiting…</span></div>`;
  } else {
    dlHtml = `<div class="dlrow"><button class="act" onclick="requestDownload('${d.token}')">Request download</button></div>`;
  }

  row.innerHTML = `
    <div>
      <div class="title">${d.title}</div>
      <div class="meta">${d.page_count} pages · ${statusBadge(v.status)}</div>
      ${dlHtml}
    </div>
    <div class="actions">${actions.innerHTML}</div>`;
  el.appendChild(row);
}

async function requestView(token) {
  try {
    const res = await fetch('/api/request', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ token })
    });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.detail || 'Request failed.');
      return;
    }
    loadDocs();
  } catch (e) { alert('Request failed.'); }
}

async function requestDownload(token) {
  try {
    const res = await fetch('/api/download/request', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ token })
    });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(err.detail || 'Request failed.');
      return;
    }
    loadDocs();
  } catch (e) { alert('Request failed.'); }
}

showView();
</script>
</body>
</html>
