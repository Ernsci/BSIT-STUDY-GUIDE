services:
  - type: web
    name: approval-docs
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_URL_PATH
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: ANTI_SPAM_MAX_PENDING
        value: "2"
      - key: ANTI_SPAM_MIN_SECONDS
        value: "60"
      - key: REQUEST_BATCH_SECONDS
        value: "15"
      - key: RENDER_SCALE
        value: "1.6"
      - key: RENDER_QUALITY
        value: "85"
      - key: REQUEST_BATCH_MAX
        value: "10"
      - key: OWNER_FACEBOOK_URL
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: TELEGRAM_POLLING
        value: "0"